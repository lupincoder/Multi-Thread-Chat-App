<!DOCTYPE html>
<html lang="en" x>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Client</title>
</head>
<body>
<h2>WebSocket Chat Test</h2>
<input type="text" id="messageInput" placeholder="Type a message..." />
<button onclick="sendMessage()">Send</button>

<div id="messages" style="margin-top: 20px;"></div>

<script>
    // Connect to your Spring Boot WebSocket endpoint
    // Use ws://localhost:8080/ws (adjust port if yours is different)
    const socket = new WebSocket('ws://localhost:8080/ws');

    // Triggered when connection is established
    socket.onopen = (event) => {
        console.log('Connected to server');
    };

    // Triggered when a message is received from the server
    socket.onmessage = (event) => {
        const messageDiv = document.getElementById('messages');
        messageDiv.innerHTML += `<p>Received: ${event.data}</p>`;
    };

    // Triggered when connection closes
    socket.onclose = (event) => {
        console.log('Disconnected from server');
    };

    // Triggered if an error occurs
    socket.onerror = (error) => {
        console.error('WebSocket Error: ', error);
    };

    // Function to send data to backend
    function sendMessage() {
        const input = document.getElementById('messageInput');
        if (socket.readyState === WebSocket.OPEN && input.value) {
            socket.send(input.value);
            input.value = ''; // Clear input
        }
    }
</script>
</body>
</html>
